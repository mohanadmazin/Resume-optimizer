name: Add Resume Auto-Align

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Add professional auto-align') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add live Auto Align feature
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          index = root / 'web/resume_dashboard/index.html'
          text = index.read_text(encoding='utf-8')

          if 'id="autoAlignButton"' not in text:
              marker = '                <button class="primary-button wide-button" type="button" id="exportPdfButton">Export PDF</button>'
              replacement = '''                <button class="primary-button wide-button" type="button" id="autoAlignButton">Auto Align Resume</button>\n                <div class="auto-align-status" id="autoAlignStatus" role="status">Automatically balance page count, typography, and margins.</div>\n                <button class="primary-button wide-button" type="button" id="exportPdfButton">Export PDF</button>'''
              if marker not in text:
                  raise SystemExit('Preview export button marker not found')
              text = text.replace(marker, replacement, 1)

              css_marker = '  <link rel="stylesheet" href="/builder/styles.css" />'
              text = text.replace(css_marker, css_marker + '\n  <link rel="stylesheet" href="/builder/auto_align.css" />', 1)

              script_marker = '</body>'
              text = text.replace(script_marker, '  <script src="/builder/auto_align.js" defer></script>\n</body>', 1)
              index.write_text(text, encoding='utf-8')

          (root / 'web/resume_dashboard/auto_align.css').write_text(r''' .resume-paper.auto-aligned {\n  --auto-font-pt: 10pt;\n  --auto-margin-mm: 18mm;\n  --auto-h-margin-mm: 21mm;\n  padding: var(--auto-margin-mm) var(--auto-h-margin-mm);\n  font-size: var(--auto-font-pt);\n  transition: padding 180ms ease, font-size 180ms ease;\n}\n\n.resume-paper.auto-aligned h1 { font-size: clamp(18pt, calc(var(--auto-font-pt) * 2.2), 22pt); }\n.resume-paper.auto-aligned .resume-title { font-size: clamp(9pt, calc(var(--auto-font-pt) * 1.08), 11pt); }\n.resume-paper.auto-aligned .resume-contact { font-size: clamp(8pt, calc(var(--auto-font-pt) * 0.9), 9pt); }\n.resume-paper.auto-aligned .resume-section { margin-top: clamp(15px, calc(var(--auto-font-pt) * 1.9), 22px); }\n.resume-paper.auto-aligned .resume-section h2 { font-size: clamp(9pt, calc(var(--auto-font-pt) * 1.08), 11pt); margin-bottom: clamp(7px, calc(var(--auto-font-pt) * 1.05), 11px); }\n.resume-paper.auto-aligned .resume-summary,\n.resume-paper.auto-aligned .resume-item-sub { font-size: clamp(8.5pt, var(--auto-font-pt), 10pt); line-height: 1.42; }\n.resume-paper.auto-aligned .resume-item-heading strong { font-size: clamp(9pt, calc(var(--auto-font-pt) * 1.04), 10.5pt); }\n.resume-paper.auto-aligned ul { font-size: clamp(9px, calc(var(--auto-font-pt) * 0.82), 11px); line-height: 1.42; margin-top: 5px; }\n.resume-paper.auto-aligned .resume-skill-list,\n.resume-paper.auto-aligned .resume-skill-grid { font-size: clamp(9px, calc(var(--auto-font-pt) * 0.84), 11px); }\n.resume-paper.auto-aligning { transition: none; }\n\n.auto-align-status { min-height: 17px; margin: 8px 0 0; color: #8f9bb0; font-size: 11px; line-height: 1.4; }\n'''.replace('\\n','\n').lstrip(), encoding='utf-8')

          (root / 'web/resume_dashboard/auto_align.js').write_text(r'''(() => {\n  const MM_TO_PX = 96 / 25.4;\n  const PAGE_H_MM = 297;\n  const MIN_FONT_PT = 9;\n  const MAX_FONT_PT = 10.5;\n  const MIN_MARGIN_MM = 12;\n  const MAX_MARGIN_MM = 22;\n\n  const paper = () => document.querySelector('#resumePreview');\n\n  function apply(el, fontPt, marginMm) {\n    el.style.setProperty('--auto-font-pt', `${fontPt}pt`);\n    el.style.setProperty('--auto-margin-mm', `${marginMm}mm`);\n    el.style.setProperty('--auto-h-margin-mm', `${Math.max(16, marginMm + 3)}mm`);\n    el.classList.add('auto-aligned');\n  }\n\n  function measure(el) {\n    const cs = getComputedStyle(el);\n    const pageHeight = PAGE_H_MM * MM_TO_PX;\n    const verticalPadding = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);\n    const usableHeight = Math.max(1, pageHeight - verticalPadding);\n    const contentHeight = Math.max(1, el.scrollHeight - verticalPadding);\n    const pages = Math.max(1, Math.ceil(contentHeight / usableHeight));\n    const lastPageHeight = contentHeight - usableHeight * (pages - 1);\n    const lastFill = Math.min(1, Math.max(0, lastPageHeight / usableHeight));\n    return { pages, lastFill };\n  }\n\n  function score(metrics, fontPt, marginMm) {\n    const lastTarget = metrics.pages === 1 ? 0.88 : 0.84;\n    const lastPenalty = Math.abs(lastTarget - metrics.lastFill) * 8;\n    const readabilityPenalty = Math.abs(10 - fontPt) * 1.5;\n    const marginPenalty = Math.abs(18 - marginMm) * 0.08;\n    const tinyPagePenalty = metrics.pages > 1 && metrics.lastFill < 0.45 ? 20 : 0;\n    return metrics.pages * 20 + lastPenalty + readabilityPenalty + marginPenalty + tinyPagePenalty;\n  }\n\n  function autoAlign() {\n    const el = paper();\n    if (!el) return;\n    const button = document.querySelector('#autoAlignButton');\n    const status = document.querySelector('#autoAlignStatus');\n    if (button) { button.disabled = true; button.textContent = 'Aligning…'; }\n    if (status) status.textContent = 'Testing professional page layouts…';\n    el.classList.add('auto-aligning');\n\n    let best = null;\n    for (let fontPt = MIN_FONT_PT; fontPt <= MAX_FONT_PT + 0.001; fontPt += 0.25) {\n      for (let marginMm = MIN_MARGIN_MM; marginMm <= MAX_MARGIN_MM; marginMm += 1) {\n        apply(el, fontPt, marginMm);\n        void el.offsetHeight;\n        const metrics = measure(el);\n        const candidate = { score: score(metrics, fontPt, marginMm), fontPt, marginMm, metrics };\n        if (!best || candidate.score < best.score) best = candidate;\n      }\n    }\n\n    if (best) {\n      apply(el, best.fontPt, best.marginMm);\n      const finalMetrics = measure(el);\n      const message = `${finalMetrics.pages} page${finalMetrics.pages === 1 ? '' : 's'} • ${best.fontPt.toFixed(2)}pt text • ${best.marginMm}mm vertical margins`;\n      if (status) status.textContent = message;\n      if (typeof window.showToast === 'function') window.showToast(`Resume aligned: ${message}.`);\n    }\n\n    el.classList.remove('auto-aligning');\n    if (button) { button.disabled = false; button.textContent = 'Auto Align Resume'; }\n  }\n\n  window.autoAlignResume = autoAlign;\n  document.addEventListener('DOMContentLoaded', () => {\n    document.querySelector('#autoAlignButton')?.addEventListener('click', autoAlign);\n  });\n})();\n'''.replace('\\n','\n').lstrip(), encoding='utf-8')

          workflow = root / '.github/workflows/add-auto-align.yml'
          workflow.unlink(missing_ok=True)

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/resume_dashboard/index.html web/resume_dashboard/auto_align.css web/resume_dashboard/auto_align.js .github/workflows/add-auto-align.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add professional auto-align to resume preview"
          git push
